<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-labelledby="title desc">
  <title id="title">Impacto Construtora</title>
  <desc id="desc">Logo Impacto Construtora — alto padrão</desc>
  <!-- Emblema -->
  <g>
    <rect x="2" y="2" width="48" height="48" rx="6" fill="#0b0b0b"/>
    <!-- moldura interna fina -->
    <rect x="7" y="7" width="38" height="38" rx="3" fill="none" stroke="#c8a86a" stroke-width="1.1" opacity="0.95"/>
    <!-- casa / pórtico -->
    <path d="M13 29.5 L26 13.5 L39 29.5" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- pilar / porta -->
    <rect x="22.8" y="22" width="6.4" height="11.2" rx="0.7" fill="#c8a86a"/>
    <!-- linha base -->
    <path d="M13 34.8 H39" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.95"/>
    <!-- detalhe superior -->
    <circle cx="26" cy="17.5" r="1.1" fill="#c8a86a"/>
  </g>
  <!-- Tipografia -->
  <g font-family="Space Grotesk, system-ui, sans-serif">
    <text x="62" y="28" font-size="26" font-weight="700" letter-spacing="3.8" fill="#0b0b0b">IMPACTO</text>
    <text x="62" y="46" font-size="11.5" font-weight="500" letter-spacing="6.2" fill="#6b6b6b">CONSTRUTORA</text>
  </g>
</svg>
